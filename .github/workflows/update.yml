name: 나라장터 수집

on:
  schedule:
    # 보조용: 한국시간 07~18시 매시 47분 (주 실행은 cron-job.org가 15분마다 신호)
    # GitHub은 UTC 기준: 한국 07~08시 = UTC 22~23시, 09~18시 = UTC 0~9시
    - cron: '47 22-23 * * *'
    - cron: '47 0-9 * * *'
  workflow_dispatch: {}   # Actions 화면의 "Run workflow" 버튼으로 수시 실행
  
permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 나라장터 API 수집
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
        run: python3 scripts/update.py data/latest.json
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet && echo "변경 없음" || (git commit -m "수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" && git push)
